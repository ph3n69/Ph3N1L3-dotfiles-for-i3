animations = ();

rules = (
  {
    match = "window_type = 'normal' && (x = 10 || x = 14) && (y = 38 || y = 42)";
    animations = (
      {
        triggers = [ "open", "show" ];

        opacity = {
          curve = "linear";
          duration = 0.15;
          start = 0;
          end = "window-raw-opacity";
        };

        # Spring slide-up (overshoots past 0 to -25px and bounces back)
        offset-y = {
          curve = "cubic-bezier(0.175, 1.65, 0.32, 1.0)";
          duration = 0.4;
          start = 120;
          end = 0;
        };
      }
    );
  }
);

shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
#inactive-opacity = 0.8;
frame-opacity = 1.0;
corner-radius = 10;
blur-kern = "3x3box";
backend = "xrender";

# --- Performance Core ---
vsync = true;

# Force Picom to skip rendering unchanged screen parts
use-damage = true;

# --- Opacity Rules ---
# This forces opacity onto Kitty through picom rather than Kitty's internal renderer,
# which prevents rendering conflicts between Kitty and Picom.
#opacity-rule = [
#  "100:class_g = 'kitty' && focused",
#  "80:class_g = 'kitty' && !focused"
#];

fading =false;

fade-in-step = 0.10;
fade-out-step = 0.10;

fade-delta = 14;

no-fading-openclose = false;
no-fading-destroyed-argb = false;

animations = (
  {
    match = "window_type = 'normal'";
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.1;

    # Apply spring physics with bounce allowed
    # Syntax: spring(stiffness, damping, mass, clamping)
    curve = "spring(260, 18, 1, true)";
    clamping = false;

  # Explicitly calculate position changes relative to the pivot center
    offset-x = {
      curve = "spring(260, 18, 1, true)";
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "spring(260, 18, 1, true)";
      start = "window-y-before - window-y"; # Use the baseline layout change
      end = 0;
    };
  }
);
